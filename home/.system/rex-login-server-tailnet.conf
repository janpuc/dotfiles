# Drop-in for the packaged rex-login-server.service (installed by 07-linux-rex): the stock command
# line plus a listener on aether's tailnet address, port 7297, where tailscaled identifies each
# caller. Tailscale Serve's 443 belongs to Pi Pocket.
[Unit]
After=tailscaled.service
Requires=tailscaled.service

[Service]
ExecStart=
ExecStart=/usr/bin/rex login-server --listen unix:///run/rex/login-server.sock --accounts /etc/rex/accounts.jsonc --runtime-root /run/rex --log-format text --pam-service rex-login-server --extra-listen tailnet://:7297
