# Site names the runner reads instead of hard-coding them.
platform:
  # Reserved sender for laptop requests. Its replies go to the coordinator's inbox.
  operator: jan
  coordinator: dotfiles
  # Senders of requests made before a project rename.
  aliases: {main: dotfiles}
  # Dispatch-only machines.
  clients: [hermes]
  # Receives remote deliveries and queues replies for the remote project.
  hub: aether
  remote: {project: work, host: sisyphus, identity: ~/.ssh/work-inbox}
  # Opens the task for a bare ticket id, as in agent CEA-123, outside a project.
  tickets: work
  # Machines that run agent jobs over SSH when switched on. Off is normal: jobs wait for them.
  workers: [hermes]
hosts:
  aether:
    root: ~/Development
    meminiPrefix: homelab
    meminiHome: personal/jan
    guard: personal
    # agent scratch opens tasks of this project. Its memini namespace is homelab/scratch.
    scratchProject: scratch
  sisyphus:
    root: ~/Work
    meminiPrefix: work
    # Every session on the work host shares work, never a personal namespace.
    meminiScratch: work
    meminiHome: none
    guard: work
    # Work scratch stays on the work host as tasks of work.
    scratchProject: work
    providers: all
    vault: Work
    backup: sisyphus-backup
    maxAgents: 5
defaults:
  host: aether
  providers: [claude-bridge, openai, minimax, opencode-go, alibaba, litellm]
  tasks: {maxOpen: 4}
  model: claude-bridge/claude-opus-5-5
  thinking: high
  meminiPrefix: homelab
  rotation:
    sizeMB: 100
    compactions: 5
    days: 30
projects:
  work:
    host: sisyphus
    lifecycle: active
    meminiNamespace: work
    # Jan fills this item before ai-sync. Existing checkouts are registered during migration.
    secrets:
      GH_TOKEN: op://Work/github/GH_TOKEN
  dotfiles:
    # janpuc/dotfiles: machine config and the agent platform. Renamed from main 2026-11-19.
    host: aether
    lifecycle: active
    repos:
      - name: dotfiles
        url: https://github.com/janpuc/dotfiles.git
  scratch:
    # Free-standing work: agent scratch "<brief>" opens a task here. agent scratch fold hands
    # it to a project, agent scratch promote asks dotfiles for a new project. Added 2026-11-19.
    host: aether
    lifecycle: active
  home:
    lifecycle: active
    repos:
      - name: home-assistant
        url: https://github.com/janpuc/home-assistant.git
    secrets:
      HA_TOKEN: op://Kubernetes/hass-mcp/HASS_MCP_TOKEN
  bigmouth:
    # Knowledge project: plan and run BigMouth's (TrueNAS, 192.168.69.15) storage and backups.
    # The key belongs to TrueNAS user aether-agent (Read-Only Administrator) and works over the
    # JSON-RPC websocket API (wss://192.168.69.15/api/current), not the REST API.
    lifecycle: active
    secrets:
      TRUENAS_API_KEY: op://Kubernetes/bigmouth-readonly/TRUENAS_API_KEY
  thesis:
    # Jan's engineering thesis (praca inżynierska, AGH): a multi-tier compute architecture for
    # games on handhelds, a Bevy voxel case study (Steam Deck client, BC250 home server).
    lifecycle: active
  gaming:
    # Gaming hardware and game ports: the BC250 gaming box, inFamous on the Steam Deck (native
    # port and recompilation), and game reverse engineering (TDU, XBOX, spore). Not renplay.
    lifecycle: active
    # Gemini 4 Neon trial from 2026-11-20 on Jan's AI Ultra login, through pi-antigravity-bridge
    # since 2026-11-22.
    model: antigravity/gemini-4-neon
    thinking: high
    repos:
      - name: bc250
        url: https://github.com/janpuc/BC250.git
  network:
    # Jan's home network: the UniFi gateway (UDR bob, 192.168.69.1), Wi-Fi, VLANs, firewall,
    # Tailscale subnet routing, Thread and Matter, Shelly. Audits, backups of the UniFi config and
    # helper scripts. Reaches the LAN from aether through the tailnet subnet router.
    lifecycle: active
    secrets:
      UNIFI_API_KEY: op://Kubernetes/unifi/UNIFI_API_KEY
      UNIFI_SSH_PASS: op://Kubernetes/unifi-ssh/password
      HA_TOKEN: op://Kubernetes/hass-mcp/HASS_MCP_TOKEN
  kubernetes:
    # Jan's Talos and Flux homelab cluster: janpuc/home-ops (registered from the Mac checkout
    # with its local branches, stashes and worktrees). kubeconfig, talosconfig and .secrets.env
    # live untracked in home-ops/. It may debug the cluster directly (kubectl, flux, helm), prefers
    # PRs, and writes any manual fix back into home-ops so git stays true.
    lifecycle: active
  renplay:
    # renplay-org: the Ren'Py player (core), lab, catalog, engines, website and the org profile,
    # plus plans and lab data. GH_TOKEN is a renplay-org fine-grained token, so gh and git use it
    # inside this workspace while other projects keep the janpuc login.
    lifecycle: active
    secrets:
      GH_TOKEN: op://Kubernetes/aether/GH_TOKEN_RENPLAY
      CLOUDFLARE_ACCOUNT_ID: op://Kubernetes/renplay-org/CLOUDFLARE_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN: op://Kubernetes/renplay-org/CLOUDFLARE_API_TOKEN
  agh:
    # Jan's studies at AGH: course assignments, lab reports and exam prep (numerical methods,
    # algorithms, computer networks) and the car rental project, a local-only repo since its
    # GitHub copy (janpuc/WypozyczalniaSamochodow) is gone.
    lifecycle: active
  ai:
    # Jan's AI tooling: the Pi packages (pi-usage, pi-footer, pi-title-spinner, pi-claude-bridge,
    # pi-optchat), model evals and the local models on sisyphus (mac-models). The agents on aether
    # run on what this project maintains.
    lifecycle: active
  polished:
    # polished: a self-hosted nail polish inventory (Python server, iOS app). The iOS app builds on
    # the Mac only.
    lifecycle: active
  austerity:
    # austerity.watch (janpuc/austerity-watch): the public, city-level map of the 2026 protest wave
    # in Europe, a static site on GitHub Pages plus its data watcher.
    lifecycle: active
  maker:
    # Jan's maker work: Xiao ESP32 boards and their 3D-printed cases (humidifier, soil and
    # moisture sensors, mmWave), and the earlier ESP32 experiments.
    lifecycle: active
  apps:
    # Jan's paid iOS, iPadOS and iPhone Duo apps. Each app is its own repo registered as a member,
    # one coordinator runs per-app tasks. Builds, signing and upload need a Mac, aether only codes.
    lifecycle: active
