# Global tools on the aether server (Linux only, see .chezmoiignore).
# Installed by `mise install` from the Linux script.
[tools]
"1password-cli" = "latest"                    # `op`, for ai-sync's GitHub login
chezmoi = "latest"
gh = "latest"                                 # git's credential helper

# The shell, as on the laptop (config.fish, starship, atuin, bat, eza; difft for git).
starship = "latest"
atuin = "latest"
zoxide = "latest"
eza = "latest"
bat = "latest"
difftastic = "latest"
