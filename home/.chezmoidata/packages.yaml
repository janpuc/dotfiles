      vscode:
        - catppuccin.catppuccin-vsc
        - catppuccin.catppuccin-vsc-icons
        - editorconfig.editorconfig
  hosts:
    hermes:
      darwin:
        # The security-research tools (ffuf … trivy); `brew bundle` runs with --force-cleanup, so
        # they have to be listed here rather than installed by hand.
        brews:
          - dfu-util
          - ffuf
          - ghidra
          - glslang # inFamous native port: Metal backend HLSL->MSL guest-shader translator (with spirv-cross)
          - spirv-cross # inFamous native port shader translator companion of glslang
          - httpx
          - innoextract # spore: static unpacking of the GOG (Inno Setup) installer
          - lld # spore: lld-link for clang-cl builds of the SporeDeck ModAPI mod
          - llvm   # Route B recompiler: pcode2llvm links LLVM C API, llc emits the lifted .o files
          - ninja
          - nmap
          - nuclei
          - opencode
          - osv-scanner
          - platformio
          - radare2
          - semgrep
          - trivy
          - xwin # spore: MSVC CRT + Windows SDK for clang-cl cross builds (licence accepted by Jan)
        casks:
          - android-commandlinetools
          - android-platform-tools # adb
          - discord
          - prismlauncher
          - protonvpn
          - tailscale-app
          - wireshark-app
          - zulu@21
        vscode:
          - bierner.markdown-mermaid
          - bluebrown.yamlfmt
          - blueglassblock.better-json5
          - hverlin.mise-vscode
          - irongeek.vscode-env
          - ms-vscode.cpptools
          - nefrob.vscode-just-syntax
          - PKief.material-icon-theme
          - platformio.platformio-ide
          - redhat.vscode-yaml
    sisyphus:
      darwin:
        # The M3 Pro model server (janpuc/mac-models): what it had installed when it joined the
        # dotfiles, so `brew bundle --force-cleanup` keeps it.
        brews:
          - llama.cpp # llama-server behind llama-swap (mac-models)
          - mercurial
          - node_exporter
          - python@3.13 # the mac-models venvs (huggingface_hub)
          - tailscale # the CLI tailscaled system daemon (`sudo brew services start tailscale`), up before any GUI login
        casks:
          - orion
          - osaurus
        vscode: []
  # The aether server (Ubuntu): only what mise cannot provide. Everything else is in
  # dot_config/mise/config.toml.
  linux:
    apt:
      - ca-certificates
      - curl
      - fish
      - git
      - jq            # Pi's modify_settings.json, which runs during apply
      - python3-pil   # trainer-media's exercise GIFs
      - python3-yaml  # aether-hosts-sync
      - zsh
