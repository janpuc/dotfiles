# Global tools on the aether server (Linux only, see .chezmoiignore). Everything installed by
# `mise install` from the linux script; nothing else is installed by hand.
[tools]
node = "lts"                                  # Pi needs >= 22.19
"npm:@earendil-works/pi-coding-agent" = "latest"   # the real `pi`; ~/.local/bin/pi is the launcher
"npm:t3" = "latest"                           # T3 Code server (self-contained binary per platform)
"1password-cli" = "latest"                    # `op`, for ai-sync
chezmoi = "latest"
gh = "latest"                                 # git's credential helper
jq = "latest"                                 # the Pi launcher's memini handshake
